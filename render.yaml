# Blueprint do Render: em render.com → New → Blueprint, escolho este repositório.
services:
  - type: web
    name: smartpark
    runtime: docker
    plan: free
    healthCheckPath: /ping
    envVars:
      - key: SMARTPARK_SENHA_ADMIN    # senha da área administrativa (o Render pede o valor na criação)
        sync: false
      # Opcional: para ligar o ESP32 simulado no Wokwi a este servidor, crie também
      # SMARTPARK_BROKER = broker.hivemq.com (o servidor passa a usar a maquete de 6 vagas)
